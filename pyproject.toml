[project]
name = "paddle-ocr"
version = "1.0.0"
description = "PaddleOCR Standalone — RapidOCR + ONNX Runtime, CPU-only"
requires-python = ">=3.10"
dependencies = [
    "rapidocr>=3.9.2",
    "onnxruntime>=1.17.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]

[tool.uv]
# 让 uv 管理虚拟环境（默认 .venv）
# uv sync / uv run 可一键还原环境并执行
# PyInstaller 打包入口在 paddle-ocr.spec，通过 Makefile 调用：
#   make package   ->  uv run pyinstaller paddle-ocr.spec
