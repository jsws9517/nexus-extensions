# ============================================================
# RapidOCR Mobile — Linux Docker Compose 分发 (ONNX Runtime 版)
#
# 用法:
#   默认端口 (8006):   docker compose -f docker/rapidocr/docker-compose.yml up -d
#   自定义端口 (9001): RAPID_PORT=9001 docker compose -f docker/rapidocr/docker-compose.yml up -d
#
#   一行切换端口, 容器内外监听 + 对外映射同步跟随, 自动适配。
#   镜像体积 ~350MB, 远小于 Paddle 版 (~1.1GB), 默认 ONNX 模型内置不联网。
# ============================================================
services:
  rapidocr-mobile:
    # 在本目录 (docker/rapidocr/) 执行: build 上下文为项目根 (../../),
    # 这样 Dockerfile 内的 COPY app_rapidocr.py / entrypoint-rapidocr.sh 才能命中项目根
    build:
      context: ../..
      dockerfile: docker/rapidocr/Dockerfile
    image: rapidocr-mobile:latest
    container_name: rapidocr-mobile
    restart: unless-stopped
    # 容器内部监听端口 = RAPID_PORT, 对外映射同源, 保证内外一致
    ports:
      - "${RAPID_PORT:-8006}:${RAPID_PORT:-8006}"
    environment:
      # 透传端口, 容器内 entrypoint 据此决定监听端口
      - RAPID_PORT=${RAPID_PORT:-8006}
      # 可选: 改变监听地址 (默认 0.0.0.0 便于外网访问)
      - RAPID_HOST=0.0.0.0
    healthcheck:
      # 探活端口跟随 RAPID_PORT (容器内监听端口), 默认 8006
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${RAPID_PORT:-8006}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # CPU 资源建议 (按需调整)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "4"
